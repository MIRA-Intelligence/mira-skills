name: Community Verify

# Trusted verifier for community PRs into the landing branch — the mira-skills
# counterpart of the engine's community-verify.yml (MIRA-Intelligence/mira-community#44).
#
# The community merge bot only counts the `mira/verify` commit status
# (MERGE_REQUIRED_CHECKS=mira/verify on the platform). This workflow produces it
# so that a PR cannot change what "verified" means:
#
# - `pull_request_target` runs *this file as it exists on the landing branch*,
#   never the PR's copy, so editing CI in a PR has no effect here.
# - The code under test is the PR merged into the current landing branch.
# - The validator is mira-hub's `check:registry` from mira-hub `main` — the
#   same check validate.yml runs — so a PR cannot bring its own schema or
#   builder; it can only add or change skills under skills/.
#
# Security model:
# - `verify` reads PR content (skill files) with a read-only token, references
#   no secrets, does not persist git credentials, uses no caches, and cannot
#   write statuses.
# - `pending` / `report` never check out PR code; only they may write the status.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [contrib]

permissions: {}

concurrency:
  group: community-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pending:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'mira/verify',
              description: 'Validating the skills in this PR against the landing branch',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Code under test = the PR merged into the landing branch as it is now,
      # so a PR that only validates against an older base can't go green.
      - name: Check out the landing branch for the merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the PR head (code under test)
        working-directory: pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          fetched="$(git rev-parse refs/remotes/pr/head)"
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "PR head moved ($HEAD_SHA -> $fetched); a newer run verifies it."
            exit 1
          fi
          git -c user.name="mira-verify" -c user.email="verify@invalid" merge --no-ff --no-edit "$HEAD_SHA"

      - name: Check out mira-hub (trusted builder)
        uses: actions/checkout@v4
        with:
          repository: MIRA-Intelligence/mira-hub
          ref: main
          path: mira-hub
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install builder deps
        working-directory: mira-hub
        run: npm ci

      - name: Validate skills (landing branch + PR, trusted builder)
        working-directory: mira-hub
        run: npm run check:registry -- --skills-dir ../pr/skills

  report:
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const ok = process.env.RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: ok ? 'success' : 'failure',
              context: 'mira/verify',
              description: ok
                ? 'Skills in this PR validate against the landing branch'
                : `Verification ${process.env.RESULT}: see the run for details`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
