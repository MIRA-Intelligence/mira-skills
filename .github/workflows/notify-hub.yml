name: notify-hub

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mira-hub deploy
        env:
          # Fine-grained personal access token scoped to
          # MIRA-Intelligence/mira-hub only, with `Contents: Read and write`
          # (what POST /dispatches requires). Repository secret on mira-skills.
          GH_PAT: ${{ secrets.MIRAHUB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::warning::MIRAHUB_DISPATCH_TOKEN is not set on mira-skills; MIRA Hub was not rebuilt. Run mira-hub's deploy workflow by hand."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MIRA-Intelligence/mira-hub/dispatches \
            -d '{"event_type":"skills-updated","client_payload":{"sha":"${{ github.sha }}"}}'
