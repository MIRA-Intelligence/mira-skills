name: notify-hub

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mira-hub deploy
        env:
          # Personal access token (or fine-grained GITHUB token) with
          # `Contents: write` on MIRA-Intelligence/mira-hub. Stored as a
          # repository secret on mira-skills.
          GH_PAT: ${{ secrets.MIRAHUB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "MIRAHUB_DISPATCH_TOKEN not configured; skipping dispatch."
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MIRA-Intelligence/mira-hub/dispatches \
            -d '{"event_type":"skills-updated","client_payload":{"sha":"${{ github.sha }}"}}'
