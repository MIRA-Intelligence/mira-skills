# Considered and skipped (keep so future reviews don't redo the work):
#   anthropics/skills docx|pdf|pptx|xlsx (+ re-hosted copies) — proprietary license; MIRA has built-ins
#   K-Dense scientific-writing|literature-review|statistical-analysis|scientific-visualization|matplotlib|
#     seaborn|scikit-survival|scientific-slides|latex-posters|pptx-posters — overlap MIRA built-ins / hub
#   K-Dense bioservices — GPL-3.0
#   K-Dense research-lookup — needs Parallel / OpenRouter keys; paper-lookup covers it keylessly
#   davila7/claude-code-templates *-database, affaan-m/*, openclaw/skills/* — re-hosts of the above
#   obra test-driven-development, mattpocock tdd — MIRA built-in TDD
#   tfriedel/claude-office-skills, luwill/research-skills, gexijin/vibe — no license
#   letta-ai/skills extracting-pdf-text — NOASSERTION license
#   JimLiu baoyu-url-to-markdown — heavy Chrome CDP runtime; defuddle covers it
#   exa-labs search — duplicate of K-Dense exa-search
#   aipoch search-pubmed — overlaps hub pubmed-search
#   aipoch meta-analysis — SKILL.md frontmatter is invalid YAML upstream
#   K-Dense bgpt-paper-search — only works through a host-configured paid MCP server
#   karpathy read-arxiv-paper — tied to the nanochat repo, writes to ~/.cache
#   ARIS arxiv|semantic-scholar|openalex|citation-audit — need unbundled ARIS helpers / Codex MCP;
#     helper lookup runs tools/*.py from the user's repo. paper-lookup covers these APIs
#   awesome-copilot convert-pdf-to-md — hijacks all PDF handling, AGPL PyMuPDF; markitdown covers it
#   obra executing-plans|requesting-code-review — need unvendored subagent-driven-development / a subagent tool
#   obra writing-plans — writes references to missing superpowers:subagent-driven-development into plans
#   obra brainstorming — third-party tracking image in its companion server, fires on almost any request
#   anthropics/knowledge-work-plugins code-review — thin slash-command checklist; find-bugs + security-review cover it
#   aipoch lab-result-interpretation — understates critical values, no unit checks (patient-facing)
#   aipoch dicom-anonymizer — crashes on typical files, leaves dates, reversible hashes; pydicom skill covers it
#   aipoch table-1-generator|irb-application-assistant|systematic-review — scripts/references missing or broken
#   aipoch clinical-trial-protocol-skill — hard-requires a Claude Desktop MCP server
#   aipoch phi-prompt-guard — blocks reading clinical files unless the user types [PHI-OK]
#   bioSkills pharmacogenomics — DPYD activity code tells normal/heterozygous patients to avoid fluoropyrimidines
