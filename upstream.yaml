# Third-party skills vendored into skills/ (curated from the LobeHub skills
# marketplace, always taken from the original author's repo, not re-hosts).
#
# Regenerate after editing this file or bumping a `ref`:
#   cd ../mira-hub && npm run vendor:upstream -- --skills-dir ../mira-skills/skills
#
# Folders listed here are owned by this manifest: they are wiped and re-copied
# on every run, and their mirahub.yaml is generated. Change tags/maturity here.
#
# Selection rules: permissive license (MIT / Apache-2.0 / BSD) or CC-BY(-SA);
# no overlap with MIRA engine built-ins (mira_engine/skills/builtin_skills).

sources:
  k-dense:
    repo: K-Dense-AI/scientific-agent-skills
    ref: 593377bb048752abb0152deab9fbb1083a6087df
    license: MIT
    author: { name: K-Dense Inc., github: K-Dense-AI }
    # Asks the agent to add K-Dense's paper to the user's manuscripts unprompted.
    strip_sections: [Citing Scientific Agent Skills]
  obra:
    repo: obra/superpowers
    ref: bb92a77741419a4ab5f06e711a283343f1ada0c3
    license: MIT
    author: { name: Jesse Vincent, github: obra }
  anthropic-skills:
    repo: anthropics/skills
    ref: dbd4588f9e1033efb41dad4bef2f7947c8993d44
    license: Apache-2.0
    author: { name: Anthropic, github: anthropics }
  anthropic-kwp:
    repo: anthropics/knowledge-work-plugins
    ref: a266ab8c3c754a3ccf7a634044fc1595fc06e50e
    license: Apache-2.0
    author: { name: Anthropic, github: anthropics }
  sentry:
    repo: getsentry/skills
    ref: f57ada2d0b640406ea7e25b11d636c530e77c58b
    license: Apache-2.0
    author: { name: Sentry, github: getsentry }
  kepano:
    repo: kepano/obsidian-skills
    ref: 3ccff5338ea700537839b21900aa5358a0402c98
    license: MIT
    author: { name: Steph Ango, github: kepano }
  daymade:
    repo: daymade/claude-code-skills
    ref: 965b50fc410f12bc0fc34b074237f1d0a4af5c27
    license: MIT
    author: { name: daymade, github: daymade }
  claude-scholar:
    repo: Galaxy-Dawn/claude-scholar
    ref: d394fb599ed9e6ea2212a9e6daa864345fe97a26
    license: MIT
    author: { name: Gaorui Zhang, github: Galaxy-Dawn }
